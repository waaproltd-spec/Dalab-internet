<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2E8C"/>
      <stop offset="100%" stop-color="#16209E"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- Bold S monogram -->
    <text x="256" y="322" font-family="Liberation Sans, Arial, sans-serif" font-weight="700"
          font-size="300" fill="#FFFFFF" text-anchor="middle">S</text>

    <!-- Ascending signal / data bars accent -->
    <g fill="#22B24C">
      <rect x="150" y="398" width="42" height="34" rx="8"/>
      <rect x="212" y="378" width="42" height="54" rx="8"/>
      <rect x="274" y="356" width="42" height="76" rx="8"/>
      <rect x="336" y="334" width="42" height="98" rx="8"/>
    </g>
  </g>
</svg>
