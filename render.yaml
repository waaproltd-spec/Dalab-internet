services:
  - type: web
    name: dalab-super-admin-dashboard
    runtime: static
    rootDir: super-admin-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked in at build time by Vite — point this at the real backend URL.
      # Must exactly match one of the origins the backend's CORS_ORIGIN
      # allows (see admin-backend-ts/render.yaml), or dashboard logins will
      # fail with a CORS error even though the API itself is reachable.
      - key: VITE_API_BASE_URL
        value: https://dalab-admin-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
