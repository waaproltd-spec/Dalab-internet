name: Build Customer App APK

# Runs on every push to main that touches this module, and can be triggered
# manually from the Actions tab. Always builds a debug APK; also builds a
# signed release APK when the CUSTOMER_KEYSTORE_BASE64 secret is configured
# (see customer-app-android/README.md for how to generate/set it).
on:
  push:
    branches: [main]
    paths:
      - "customer-app-android/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: customer-app-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dalab-customer-debug-apk
          path: customer-app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: keystore
        env:
          CUSTOMER_KEYSTORE_BASE64: ${{ secrets.CUSTOMER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CUSTOMER_KEYSTORE_BASE64" ]; then
            echo "No CUSTOMER_KEYSTORE_BASE64 secret set — skipping release signing."
            exit 0
          fi
          echo "$CUSTOMER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/customer-release.jks"
          echo "path=$RUNNER_TEMP/customer-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ steps.keystore.outputs.path != '' }}
        env:
          CUSTOMER_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          CUSTOMER_KEYSTORE_PASSWORD: ${{ secrets.CUSTOMER_KEYSTORE_PASSWORD }}
          CUSTOMER_KEY_ALIAS: ${{ secrets.CUSTOMER_KEY_ALIAS }}
          CUSTOMER_KEY_PASSWORD: ${{ secrets.CUSTOMER_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: ${{ steps.keystore.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dalab-customer-release-apk
          path: customer-app-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build release AAB (Play Store)
        if: ${{ steps.keystore.outputs.path != '' }}
        env:
          CUSTOMER_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          CUSTOMER_KEYSTORE_PASSWORD: ${{ secrets.CUSTOMER_KEYSTORE_PASSWORD }}
          CUSTOMER_KEY_ALIAS: ${{ secrets.CUSTOMER_KEY_ALIAS }}
          CUSTOMER_KEY_PASSWORD: ${{ secrets.CUSTOMER_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Upload release AAB
        if: ${{ steps.keystore.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dalab-customer-release-aab
          path: customer-app-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
