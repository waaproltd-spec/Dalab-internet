name: Build Agent App APK

# Runs on every push to main that touches this module, and can also be
# triggered manually from the Actions tab. Uses GitHub's own Gradle setup
# action rather than this project's gradlew, and builds both a debug APK
# and a signed release APK. Release signing uses the AGENT_KEYSTORE_BASE64
# secret when configured (see agent-app/README.md), otherwise Gradle falls
# back to the committed agent-app/app/release.keystore — either way
# `assembleRelease` always produces a signed, installable APK.
on:
  push:
    branches: [main]
    paths:
      - "agent-app/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agent-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dalab-agent-unit-test-results
          path: agent-app/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dalab-agent-debug-apk
          path: agent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: keystore
        env:
          AGENT_KEYSTORE_BASE64: ${{ secrets.AGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AGENT_KEYSTORE_BASE64" ]; then
            echo "No AGENT_KEYSTORE_BASE64 secret set — skipping release signing."
            exit 0
          fi
          echo "$AGENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/agent-release.jks"
          echo "path=$RUNNER_TEMP/agent-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          AGENT_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          AGENT_KEYSTORE_PASSWORD: ${{ secrets.AGENT_KEYSTORE_PASSWORD }}
          AGENT_KEY_ALIAS: ${{ secrets.AGENT_KEY_ALIAS }}
          AGENT_KEY_PASSWORD: ${{ secrets.AGENT_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dalab-agent-release-apk
          path: agent-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # actions/upload-artifact always produces a .zip, and it can only be
      # downloaded through an authenticated GitHub session — both a
      # dealbreaker for tapping "install" straight from a phone browser. A
      # Release asset is the one place GitHub serves a raw, directly
      # downloadable file, and it's uploaded here by the runner itself
      # rather than fetched by a client, so it works even from networks
      # that can't reach GitHub's artifact blob storage host.
      - name: Publish direct-download release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="agent-app-run-${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            agent-app/app/build/outputs/apk/debug/app-debug.apk \
            agent-app/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Agent App build #${{ github.run_number }} ($SHORT_SHA)" \
            --notes "Automated build from commit $SHORT_SHA on ${{ github.ref_name }}. Direct-installable APKs — no zip, no GitHub login needed. app-debug.apk is unminified (larger, matches the historically-installed build); app-release.apk is R8-shrunk (smaller) and signed with the release keystore — the two are NOT interchangeable updates for each other since they're signed with different keys." \
            --target "${{ github.sha }}"
