name: Build Agent App APK

# Runs on every push to main that touches this module, and can also be
# triggered manually from the Actions tab. Uses GitHub's own Gradle setup
# action rather than this project's gradlew, and builds both a debug APK
# and a signed release APK. Release signing uses the AGENT_KEYSTORE_BASE64
# secret when configured (see agent-app/README.md), otherwise Gradle falls
# back to the committed agent-app/app/release.keystore — either way
# `assembleRelease` always produces a signed, installable APK.
on:
  push:
    branches: [main]
    paths:
      - "agent-app/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: agent-app

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dalab-agent-debug-apk
          path: agent-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: keystore
        env:
          AGENT_KEYSTORE_BASE64: ${{ secrets.AGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AGENT_KEYSTORE_BASE64" ]; then
            echo "No AGENT_KEYSTORE_BASE64 secret set — skipping release signing."
            exit 0
          fi
          echo "$AGENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/agent-release.jks"
          echo "path=$RUNNER_TEMP/agent-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          AGENT_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          AGENT_KEYSTORE_PASSWORD: ${{ secrets.AGENT_KEYSTORE_PASSWORD }}
          AGENT_KEY_ALIAS: ${{ secrets.AGENT_KEY_ALIAS }}
          AGENT_KEY_PASSWORD: ${{ secrets.AGENT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dalab-agent-release-apk
          path: agent-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish build to GitHub Release
        # Same reasoning as the Customer App's build workflow: a Release
        # asset is directly downloadable (no Actions-UI login friction) and
        # this repo is public, so no repo-auth is needed to fetch it either.
        # Reuses one fixed tag so every run overwrites the previous asset
        # instead of accumulating storage over time.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-app-latest-build
          name: "Agent App build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
            Not a versioned release - this tag's assets are overwritten by every run.
          prerelease: true
          make_latest: false
          files: |
            agent-app/app/build/outputs/apk/debug/app-debug.apk
            agent-app/app/build/outputs/apk/release/app-release.apk
