databases:
  - name: dalab-admin-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: dalab-admin-backend
    runtime: node
    plan: free
    # Installs deps, compiles TypeScript, then applies the SQL migration —
    # in that order, since migrate.js only exists after the build step.
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: dalab-admin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
