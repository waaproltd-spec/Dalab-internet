databases:
  - name: dalab-admin-db
    # Upgraded off the free tier: a free Postgres instance on Render also
    # expires (deleted) after 30-90 days regardless of the web service's
    # sleep behavior — paid removes both that expiry and any resource
    # throttling shared with the free-tier pool.
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: web
    name: dalab-admin-backend
    runtime: node
    # Upgraded off the free tier specifically to remove idle spin-down/
    # cold-start delays — a free-tier instance sleeps after ~15 minutes of
    # inactivity and can take tens of seconds to wake, which is what caused
    # the intermittent heartbeat "Failed to connect" reports from the Agent
    # App's Reliability Dashboard. A paid plan stays running continuously.
    plan: starter
    # Installs deps, compiles TypeScript, then applies the SQL migration —
    # in that order, since migrate.js only exists after the build step.
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: dalab-admin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Required as of the CORS/production hardening pass — the server now
      # refuses to start in production without this set (previously silently
      # allowed any origin). Set to the Super Admin dashboard's real deployed
      # origin(s), comma-separated if there's more than one (e.g. a staging
      # and a production URL).
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
    healthCheckPath: /health
